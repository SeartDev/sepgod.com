<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libreta Digital Avanzada</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #2b2b2b;
            background-image: radial-gradient(circle, #4a4a4a, #1a1a1a);
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* --- PANTALLA DE INICIO Y MODALES --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
        }
        .modal-box {
            background: #fff; padding: 40px; border-radius: 10px;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 450px; max-height: 80vh; display: flex; flex-direction: column;
        }
        .modal-box h2 { margin-bottom: 20px; color: #333; }
        .modal-box input[type="text"] {
            width: 100%; padding: 10px; margin-bottom: 20px;
            border: 1px solid #ccc; border-radius: 5px; font-size: 16px;
        }
        .modal-box .color-picker {
            display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 30px;
        }
        .modal-box input[type="color"] { width: 50px; height: 50px; border: none; cursor: pointer; }
        .btn-action {
            background: #27ae60; color: white; border: none; padding: 12px 25px;
            font-size: 18px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%;
        }
        .btn-action:hover { background: #2ecc71; }
        .btn-close {
            background: #e74c3c; margin-top: 10px;
        }
        .btn-close:hover { background: #c0392b; }

        /* Lista del Índice */
        .index-list {
            list-style: none; text-align: left; overflow-y: auto; flex: 1; padding-right: 10px;
        }
        .index-list li {
            padding: 10px; border-bottom: 1px solid #eee; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center; transition: background 0.2s;
        }
        .index-list li:hover { background: #f9f9f9; }
        .index-list li strong { color: #2980b9; }

        /* --- BARRA DE HERRAMIENTAS --- */
        #app-container { display: none; flex-direction: column; align-items: center; width: 100%; }

        .toolbar {
            background: #ffffff; padding: 10px 20px; border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: flex; gap: 15px;
            margin-bottom: 30px; align-items: center; z-index: 10; flex-wrap: wrap; justify-content: center;
        }
        .btn {
            padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer;
            font-weight: bold; font-size: 14px; transition: transform 0.2s, box-shadow 0.2s;
            display: flex; align-items: center; gap: 5px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

        .btn-color { width: 30px; height: 30px; border-radius: 50%; padding: 0; border: 2px solid transparent;}
        .btn-color.active { border-color: #f39c12; transform: scale(1.1); box-shadow: 0 0 8px #f39c12; }
        .color-black { background-color: #2c3e50; }
        .color-blue { background-color: #2980b9; }
        .color-red { background-color: #c0392b; }
        
        .btn-tool { background-color: #34495e; color: white; }
        .btn-image { background-color: #27ae60; color: white; }
        .btn-save { background-color: #8e44ad; color: white; }
        .btn-load { background-color: #f39c12; color: white; }
        input[type="file"] { display: none; }
        .divider { width: 1px; height: 30px; background: #ccc; margin: 0 5px; }

        /* --- LIBRETA 3D --- */
        .book-container { 
            perspective: 1500px; 
            width: 1100px; 
            height: 820px; 
            position: relative; 
        }
        .book {
            display: flex; width: 100%; height: 100%; position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); border-radius: 10px; background: #222;
        }
        
        .spine {
            position: absolute; left: 50%; top: 0; bottom: 0; width: 40px; transform: translateX(-50%);
            background: linear-gradient(to right, rgba(0,0,0,0.4), rgba(0,0,0,0.6), rgba(0,0,0,0.4));
            z-index: 100; pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-evenly; align-items: center;
        }
        .spiral-ring {
            width: 35px; height: 12px; background: linear-gradient(to bottom, #f0f0f0, #888, #f0f0f0);
            border-radius: 6px; box-shadow: 2px 2px 5px rgba(0,0,0,0.7);
        }

        /* Envoltorios de Páginas */
        .page-wrapper {
            width: 50%; height: 100%; position: absolute; top: 0;
            background-color: #fdfaf6; overflow: hidden;
            display: flex; flex-direction: column; cursor: text; 
        }
        .page-wrapper.left { left: 0; border-radius: 10px 0 0 10px; box-shadow: inset -10px 0 20px rgba(0,0,0,0.1); }
        .page-wrapper.right { right: 0; border-radius: 0 10px 10px 0; box-shadow: inset 10px 0 20px rgba(0,0,0,0.1); }

        /* Encabezado (Título y Fecha) */
        .page-header { height: 50px; padding: 10px 30px; display: flex; align-items: center; justify-content: space-between; z-index: 10;}
        .page-title, .page-date {
            border: none; background: transparent; border-bottom: 1px dashed #bdc3c7;
            font-family: 'Caveat', cursive; font-size: 22px; color: #2c3e50; outline: none;
        }
        .page-title { width: 60%; text-align: left; }
        .page-date { width: 35%; text-align: right; }
        
        .page-num {
            position: absolute; bottom: 15px; font-family: sans-serif; font-size: 14px;
            color: #7f8c8d; font-weight: bold; pointer-events: none; z-index: 70;
        }
        .page-wrapper.left .page-num { left: 25px; }
        .page-wrapper.right .page-num { right: 25px; }

        /* --- REGLAS DE TEXTO (30x60) --- */
        .page-content {
            font-family: 'Consolas', 'Courier New', monospace; 
            font-size: 20px; 
            line-height: 25px; 
            color: #2c3e50;
            flex: 1; 
            padding: 5px 0 15px 0; 
            outline: none; 
            position: relative;
            word-break: break-word;
            max-width: 60ch; 
            width: 100%;
            margin: 0 auto;
            min-height: calc(100% - 60px); 
            background-image: linear-gradient(#ccc 1px, transparent 1px); 
            background-size: 100% 25px;
            background-position: 0 4px;
            overflow: visible; 
        }
        
        /* Margen Rojo */
        .page-wrapper.left {
            background-image: linear-gradient(270deg, transparent 49px, #ff9999 49px, #ff9999 51px, transparent 51px);
        }
        .page-wrapper.right {
            background-image: linear-gradient(90deg, transparent 49px, #ff9999 49px, #ff9999 51px, transparent 51px);
        }

        /* --- DISEÑO DE PORTADAS --- */
        .cover-front, .cover-back { background-image: none !important; background-color: var(--cover-color); cursor: default;}
        .cover-front {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            box-shadow: inset 15px 0 30px rgba(0,0,0,0.3) !important; padding: 40px;
        }
        
        /* Título de portada editable */
        .cover-front h1 {
            font-family: 'Playfair Display', serif; font-size: 3.5rem; color: #fff;
            text-align: center; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            border: 4px solid #fff; padding: 20px; border-radius: 10px; background: rgba(0,0,0,0.1);
            word-break: break-word; outline: none; transition: box-shadow 0.3s;
        }
        .cover-front h1:focus {
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            background: rgba(0,0,0,0.2);
        }

        .cover-inside {
            background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.05) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.05) 75%, rgba(0,0,0,0.05)),
                              repeating-linear-gradient(45deg, rgba(0,0,0,0.05) 25%, #fdfaf6 25%, #fdfaf6 75%, rgba(0,0,0,0.05) 75%, rgba(0,0,0,0.05)) !important;
            background-position: 0 0, 15px 15px !important; background-size: 30px 30px !important;
            box-shadow: inset -15px 0 30px rgba(0,0,0,0.1) !important;
            cursor: default;
        }

        /* --- EFECTO DE DOBLADO (CURL) DINÁMICO --- */
        .corner-hitbox {
            position: absolute; bottom: 0; width: 100px; height: 100px; z-index: 80; cursor: pointer;
        }
        .corner-hitbox.next { right: 0; }
        .corner-hitbox.prev { left: 0; }

        .curl {
            position: absolute; bottom: 0; width: 0; height: 0; z-index: 50;
            transition: all 0.2s ease-out; pointer-events: none;
        }
        .curl-next { right: 0; border-bottom: 0px solid #ddd; border-left: 0px solid transparent; }
        .curl-prev { left: 0; border-bottom: 0px solid #ddd; border-right: 0px solid transparent; }
        
        .corner-hitbox.next:hover ~ .curl-next { 
            border-bottom: 70px solid #ddd; border-left: 70px solid transparent; 
            box-shadow: -5px -5px 10px rgba(0,0,0,0.2); 
        }
        .corner-hitbox.prev:hover ~ .curl-prev { 
            border-bottom: 70px solid #ddd; border-right: 70px solid transparent; 
            box-shadow: 5px -5px 10px rgba(0,0,0,0.2); 
        }

        /* --- IMÁGENES QUE PERMITEN TEXT WRAPPING --- */
        .draggable-img {
            z-index: 40; border: 2px dashed rgba(0,0,0,0.4);
            background: rgba(255,255,255,0.5); resize: both; overflow: hidden;
            min-width: 80px; min-height: 80px; max-width: 90%; max-height: 90%; 
            cursor: grab; display: block;
        }
        .draggable-img:active { cursor: grabbing; }
        .draggable-img img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        .page-content:not(:focus-within) .draggable-img { border-color: transparent; background: transparent; }
        .resize-handle-area {
            position: absolute; right: 0; bottom: 0; width: 25px; height: 25px;
            cursor: se-resize; background: transparent; z-index: 45;
        }

        /* --- ANIMACIÓN 3D FLIP --- */
        .flip-page {
            position: absolute; top: 0; right: 0; width: 50%; height: 100%;
            transform-origin: left center; transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
            transform-style: preserve-3d; z-index: 200; pointer-events: none;
        }
        .flip-page .front, .flip-page .back {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            backface-visibility: hidden; background-color: #fdfaf6; overflow: hidden;
        }
        .flip-page .front { border-radius: 0 10px 10px 0; box-shadow: inset 10px 0 20px rgba(0,0,0,0.05); }
        .flip-page .back {
            transform: rotateY(180deg); border-radius: 10px 0 0 10px;
            box-shadow: inset -10px 0 20px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <!-- Modales de la Aplicación -->
    <div id="startup-modal" class="modal-overlay">
        <div class="modal-box">
            <h2>Configura tu Libreta</h2>
            <input type="text" id="setupName" placeholder="Título de la Libreta" value="Mi Libreta">
            <div class="color-picker">
                <label><b>Color de Pasta:</b></label>
                <input type="color" id="setupColor" value="#2c3e50">
            </div>
            <button class="btn-action" onclick="startApp()">Empezar a Escribir</button>
        </div>
    </div>

    <div id="search-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <h2>Buscar Palabra</h2>
            <input type="text" id="searchInput" placeholder="Escribe lo que deseas buscar...">
            <button class="btn-action" onclick="executeSearch()">Buscar</button>
            <button class="btn-action btn-close" onclick="closeModals()">Cancelar</button>
        </div>
    </div>

    <div id="index-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <h2>Índice Temático</h2>
            <p style="font-size:14px; color:#777; margin-bottom:15px;">Listado de títulos y subtemas detectados:</p>
            <ul class="index-list" id="indexList">
                <!-- Se inyectan los temas automáticamente -->
            </ul>
            <button class="btn-action btn-close" onclick="closeModals()">Cerrar</button>
        </div>
    </div>

    <!-- Contenedor Principal -->
    <div id="app-container">
        <div class="toolbar">
            <button class="btn btn-tool" onclick="openSearchModal()">&#128269; Buscar</button>
            <button class="btn btn-tool" onclick="openIndexModal()">&#128209; Índice</button>

            <div class="divider"></div>

            <button class="btn btn-color color-black active" onclick="setPenColor('#2c3e50', this)" title="Pluma Negra"></button>
            <button class="btn btn-color color-blue" onclick="setPenColor('#2980b9', this)" title="Pluma Azul"></button>
            <button class="btn btn-color color-red" onclick="setPenColor('#c0392b', this)" title="Pluma Roja"></button>
            
            <div class="divider"></div>

            <label class="btn btn-image">
                &#128247; Añadir Imagen
                <input type="file" id="imageInput" accept="image/png, image/jpeg, image/webp" onchange="insertImage(event)">
            </label>
            
            <div class="divider"></div>

            <button class="btn btn-save" onclick="exportNotebook()">&#128190; Guardar</button>
            <label class="btn btn-load">
                &#128194; Cargar
                <input type="file" id="loadInput" accept=".json" onchange="importNotebook(event)">
            </label>
        </div>

        <div class="book-container">
            <div class="book" id="book">
                <div class="spine" id="spine"></div>
                
                <!-- Página Izquierda -->
                <div id="page-left-wrap" class="page-wrapper left">
                    <div class="page-header" id="header-left">
                        <input type="text" class="page-title" id="title-left" placeholder="Tema..." onchange="saveContent()">
                        <input type="text" class="page-date" id="date-left" placeholder="Fecha..." onchange="saveContent()">
                    </div>
                    <div id="content-left" class="page-content" contenteditable="true" oninput="saveContent()"></div>
                    <div class="page-num" id="num-left"></div>
                    
                    <div class="corner-hitbox prev" onclick="turnPrev()" title="Página anterior"></div>
                    <div class="curl curl-prev" id="curl-left"></div>
                </div>

                <!-- Página Derecha -->
                <div id="page-right-wrap" class="page-wrapper right">
                    <!-- PORTADA DINÁMICA INYECTADA POR JS -->
                    <div class="page-header" id="header-right">
                        <input type="text" class="page-title" id="title-right" placeholder="Tema..." onchange="saveContent()">
                        <input type="text" class="page-date" id="date-right" placeholder="Fecha..." onchange="saveContent()">
                    </div>
                    <div id="content-right" class="page-content" contenteditable="true" oninput="saveContent()"></div>
                    <div class="page-num" id="num-right"></div>
                    
                    <div class="corner-hitbox next" onclick="turnNext()" title="Página siguiente"></div>
                    <div class="curl curl-next" id="curl-right"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- ESTADO DE LA APLICACIÓN ---
        let notebook = {
            config: { name: "Mi Libreta", color: "#2c3e50" },
            pages: []
        };
        let currentIndex = -2; 
        let isFlipping = false;

        const appContainer = document.getElementById('app-container');
        const startupModal = document.getElementById('startup-modal');
        const searchModal = document.getElementById('search-modal');
        const indexModal = document.getElementById('index-modal');
        const book = document.getElementById('book');
        
        const wrapLeft = document.getElementById('page-left-wrap');
        const contentLeft = document.getElementById('content-left');
        const titleLeft = document.getElementById('title-left');
        const dateLeft = document.getElementById('date-left');
        const numLeft = document.getElementById('num-left');
        const headerLeft = document.getElementById('header-left');

        const wrapRight = document.getElementById('page-right-wrap');
        const contentRight = document.getElementById('content-right');
        const titleRight = document.getElementById('title-right');
        const dateRight = document.getElementById('date-right');
        const numRight = document.getElementById('num-right');
        const headerRight = document.getElementById('header-right');

        // --- MANEJO DE MODALES ---
        function closeModals() {
            searchModal.style.display = 'none';
            indexModal.style.display = 'none';
            document.getElementById('searchInput').value = '';
        }

        function openSearchModal() {
            saveContent();
            searchModal.style.display = 'flex';
            setTimeout(() => document.getElementById('searchInput').focus(), 100);
        }

        function openIndexModal() {
            saveContent();
            const list = document.getElementById('indexList');
            list.innerHTML = '';
            let hasEntries = false;
            
            for(let i=0; i<notebook.pages.length; i++) {
                const page = notebook.pages[i];
                if(page.title && page.title.trim() !== "") {
                    hasEntries = true;
                    const li = document.createElement('li');
                    li.innerHTML = `<span>${page.title}</span> <strong>Pág. ${i + 1}</strong>`;
                    li.onclick = () => {
                        jumpToPage(i);
                    };
                    list.appendChild(li);
                }
            }
            
            if(!hasEntries) {
                list.innerHTML = '<li><span style="color:#7f8c8d;">Aún no has escrito ningún título.</span></li>';
            }
            indexModal.style.display = 'flex';
        }

        function executeSearch() {
            saveContent();
            const term = document.getElementById('searchInput').value.toLowerCase().trim();
            if(!term) return;

            for(let i=0; i<notebook.pages.length; i++) {
                const page = notebook.pages[i];
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = page.html || "";
                const textContent = tempDiv.textContent.toLowerCase();
                const titleContent = (page.title || "").toLowerCase();
                const dateContent = (page.date || "").toLowerCase();

                if (textContent.includes(term) || titleContent.includes(term) || dateContent.includes(term)) {
                    jumpToPage(i);
                    return;
                }
            }
            alert("No se encontró la palabra en la libreta.");
        }

        function jumpToPage(targetPageIndex) {
            let targetViewIndex = (targetPageIndex % 2 !== 0) ? targetPageIndex + 1 : targetPageIndex;
            if (currentIndex !== targetViewIndex) {
                currentIndex = targetViewIndex;
                updateView();
            }
            closeModals();
        }

        // --- SISTEMA DE FOCO MAGNÉTICO ---
        document.querySelectorAll('.page-wrapper').forEach(wrap => {
            wrap.addEventListener('click', (e) => {
                if (e.target.classList.contains('page-wrapper') || e.target.classList.contains('page-content')) {
                    const editor = wrap.querySelector('.page-content');
                    if(editor && editor.contentEditable === 'true') {
                        editor.focus();
                        try {
                            const range = document.createRange();
                            range.selectNodeContents(editor);
                            range.collapse(false);
                            const sel = window.getSelection();
                            sel.removeAllRanges();
                            sel.addRange(range);
                        } catch(err) {}
                    }
                }
            });
        });

        // --- INICIALIZACIÓN ---
        function startApp() {
            notebook.config.name = document.getElementById('setupName').value || "Mi Libreta";
            notebook.config.color = document.getElementById('setupColor').value;
            document.documentElement.style.setProperty('--cover-color', notebook.config.color);
            
            for(let i=0; i<4; i++) notebook.pages.push({html: "", date: "", title: ""});
            
            startupModal.style.display = 'none';
            appContainer.style.display = 'flex';
            
            updateView();
            document.execCommand('styleWithCSS', false, true);
            document.execCommand('foreColor', false, '#2c3e50');
        }

        function ensurePagesExist(targetIndex) {
            while (targetIndex + 2 > notebook.pages.length) {
                notebook.pages.push({html: "", date: "", title: ""});
            }
        }

        // Modificar Título de Portada
        function updateCoverTitle(newTitle) {
            notebook.config.name = newTitle;
        }

        function saveContent() {
            if(isFlipping) return;
            let dataIndexLeft = currentIndex - 1;
            if (dataIndexLeft >= 0 && notebook.pages[dataIndexLeft]) {
                notebook.pages[dataIndexLeft].html = contentLeft.innerHTML;
                notebook.pages[dataIndexLeft].title = titleLeft.value;
                notebook.pages[dataIndexLeft].date = dateLeft.value;
            }
            let dataIndexRight = currentIndex;
            if (dataIndexRight >= 0 && notebook.pages[dataIndexRight]) {
                notebook.pages[dataIndexRight].html = contentRight.innerHTML;
                notebook.pages[dataIndexRight].title = titleRight.value;
                notebook.pages[dataIndexRight].date = dateRight.value;
            }
        }

        function updateView() {
            if (currentIndex === -2) {
                wrapLeft.style.visibility = 'hidden';
                wrapRight.className = 'page-wrapper right cover-front';
                contentRight.contentEditable = 'false';
                // Renderizar Título Editable en Portada
                contentRight.innerHTML = `<h1 contenteditable="true" spellcheck="false" onblur="updateCoverTitle(this.innerText)">${notebook.config.name}</h1>`;
                headerRight.style.display = 'none';
                numRight.style.display = 'none';
                return;
            }

            wrapLeft.style.visibility = 'visible';
            headerRight.style.display = 'flex';
            numRight.style.display = 'block';
            contentRight.contentEditable = 'true';
            wrapRight.className = 'page-wrapper right';

            if (currentIndex === 0) {
                wrapLeft.className = 'page-wrapper left cover-inside';
                contentLeft.contentEditable = 'false';
                contentLeft.innerHTML = '';
                headerLeft.style.display = 'none';
                numLeft.style.display = 'none';
            } else {
                wrapLeft.className = 'page-wrapper left';
                contentLeft.contentEditable = 'true';
                headerLeft.style.display = 'flex';
                numLeft.style.display = 'block';
                
                let pLeft = notebook.pages[currentIndex - 1] || {html:"", date:"", title:""};
                contentLeft.innerHTML = pLeft.html;
                titleLeft.value = pLeft.title || "";
                dateLeft.value = pLeft.date || "";
                numLeft.innerText = currentIndex;
            }

            let pRight = notebook.pages[currentIndex] || {html:"", date:"", title:""};
            contentRight.innerHTML = pRight.html;
            titleRight.value = pRight.title || "";
            dateRight.value = pRight.date || "";
            numRight.innerText = currentIndex + 1;
        }

        function setPenColor(color, btn) {
            document.querySelectorAll('.btn-color').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.execCommand('styleWithCSS', false, true);
            document.execCommand('foreColor', false, color);
            
            if (document.activeElement !== contentLeft && document.activeElement !== contentRight) {
                if(currentIndex >= 0) contentRight.focus();
            }
        }

        // --- INSERCIÓN DE IMÁGENES FLOTANTES (Permite text wrapping) ---
        function insertImage(event) {
            if(currentIndex === -2) return alert("Abre la libreta primero para insertar imágenes.");
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                // Se inserta como float: left por defecto para que el texto lo rodee.
                // Se le agrega el atributo draggable nativo de HTML5
                const imgHTML = `&nbsp;<div class="draggable-img" contenteditable="false" draggable="true" style="float: left; margin: 10px 15px 10px 0;" title="Doble clic para cambiar alineación. Arrastra para mover por el texto."><img src="${e.target.result}" alt="img"><div class="resize-handle-area"></div></div>&nbsp;`;
                
                let target = contentRight;
                if (document.activeElement === contentLeft && currentIndex > 0) {
                    target = contentLeft;
                }
                
                target.focus();
                document.execCommand('insertHTML', false, imgHTML);
                saveContent();
            }
            reader.readAsDataURL(file);
            event.target.value = ''; 
        }

        // --- DOBLE CLIC PARA CAMBIAR ALINEACIÓN DE LA IMAGEN ---
        document.addEventListener('dblclick', (e) => {
            const wrapper = e.target.closest('.draggable-img');
            if (wrapper) {
                // Cambia de float: left a float: right
                if (wrapper.style.float === 'left') {
                    wrapper.style.float = 'right';
                    wrapper.style.margin = '10px 0 10px 15px'; // Margen a la izquierda del cuadro
                } else {
                    wrapper.style.float = 'left';
                    wrapper.style.margin = '10px 15px 10px 0'; // Margen a la derecha del cuadro
                }
                saveContent();
                window.getSelection().removeAllRanges(); // Quitar selección accidental de texto
            }
        });

        // --- ANIMACIONES 3D FLIP ---
        function turnNext() {
            if (isFlipping) return;
            isFlipping = true;
            saveContent();
            ensurePagesExist(currentIndex + 2);

            const flipper = document.createElement('div');
            flipper.className = 'flip-page';
            
            const frontHTML = wrapRight.outerHTML;
            
            let backHTML = "";
            if (currentIndex === -2) {
                backHTML = `<div class="page-wrapper left cover-inside" style="width:100%; height:100%;"></div>`;
            } else {
                let nextLeftData = notebook.pages[currentIndex + 1] || {title:"", date:"", html:""};
                backHTML = `
                    <div class="page-wrapper left" style="width:100%; height:100%;">
                        <div class="page-header" style="justify-content:space-between;">
                            <input type="text" class="page-title" value="${nextLeftData.title || ''}" disabled>
                            <input type="text" class="page-date" value="${nextLeftData.date || ''}" disabled>
                        </div>
                        <div class="page-content">${nextLeftData.html || ''}</div>
                        <div class="page-num" style="left:20px;">${currentIndex + 2}</div>
                    </div>`;
            }
            
            flipper.innerHTML = `<div class="front">${frontHTML}</div><div class="back">${backHTML}</div>`;
            book.appendChild(flipper);

            currentIndex += 2;
            updateView(); 

            setTimeout(() => { flipper.style.transform = 'rotateY(-180deg)'; }, 50);
            setTimeout(() => { flipper.remove(); isFlipping = false; }, 850);
        }

        function turnPrev() {
            if (isFlipping || currentIndex === -2) return;
            isFlipping = true;
            saveContent();

            const flipper = document.createElement('div');
            flipper.className = 'flip-page';
            flipper.style.transform = 'rotateY(-180deg)';
            
            const backHTML = wrapLeft.outerHTML;
            
            let frontHTML = "";
            if (currentIndex === 0) {
                frontHTML = `
                    <div class="page-wrapper right cover-front" style="width:100%; height:100%; background-color:${notebook.config.color};">
                        <h1 contenteditable="false">${notebook.config.name}</h1>
                    </div>`;
            } else {
                let prevRightData = notebook.pages[currentIndex - 2] || {title:"", date:"", html:""};
                frontHTML = `
                    <div class="page-wrapper right" style="width:100%; height:100%;">
                        <div class="page-header" style="justify-content:space-between;">
                            <input type="text" class="page-title" value="${prevRightData.title || ''}" disabled>
                            <input type="text" class="page-date" value="${prevRightData.date || ''}" disabled>
                        </div>
                        <div class="page-content">${prevRightData.html || ''}</div>
                        <div class="page-num" style="right:20px;">${currentIndex - 1}</div>
                    </div>`;
            }

            flipper.innerHTML = `<div class="front">${frontHTML}</div><div class="back">${backHTML}</div>`;
            book.appendChild(flipper);

            currentIndex -= 2;
            updateView();

            setTimeout(() => { flipper.style.transform = 'rotateY(0deg)'; }, 50);
            setTimeout(() => { flipper.remove(); isFlipping = false; }, 850);
        }

        // --- SISTEMA JSON ---
        function exportNotebook() {
            saveContent();
            const dataStr = JSON.stringify(notebook);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `${notebook.config.name.replace(/\s+/g, '_')}_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importNotebook(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.config && data.pages) {
                        notebook = data;
                        document.documentElement.style.setProperty('--cover-color', notebook.config.color);
                        currentIndex = -2; 
                        appContainer.style.display = 'flex';
                        startupModal.style.display = 'none';
                        updateView();
                    } else {
                        alert("El archivo no es una libreta válida.");
                    }
                } catch (err) {
                    alert("Error leyendo el archivo.");
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // Crear los anillos al iniciar
        const spineObj = document.getElementById('spine');
        for(let i=0; i<16; i++){
            const ring = document.createElement('div');
            ring.className = 'spiral-ring';
            spineObj.appendChild(ring);
        }
    </script>
</body>
</html>
