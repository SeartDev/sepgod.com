<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S I S T E M A - Quest Log</title>
    <style>
        :root {
            --bg-base: #050507;
            --panel-bg: #121217;
            --neon-blue: #00d2ff;
            --neon-blue-glow: rgba(0, 210, 255, 0.4);
            --neon-red: #ff3366;
            --neon-red-glow: rgba(255, 51, 102, 0.4);
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --system-font: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            background-image: 
                linear-gradient(rgba(0, 210, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 210, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-family: var(--system-font);
            color: var(--neon-blue);
            text-transform: uppercase;
            letter-spacing: 5px;
            font-size: 2.5rem;
            text-shadow: 0 0 10px var(--neon-blue-glow);
            margin-bottom: 0.5rem;
        }

        .system-alert {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            width: 100%;
            max-width: 800px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button, .btn-upload {
            background: transparent;
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
            padding: 0.8rem 1.5rem;
            font-family: var(--system-font);
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 10px transparent, 0 0 10px transparent;
            border-radius: 4px;
            display: inline-block;
            text-align: center;
        }

        button:hover, .btn-upload:hover {
            background: rgba(0, 210, 255, 0.1);
            box-shadow: inset 0 0 15px var(--neon-blue-glow), 0 0 15px var(--neon-blue-glow);
            text-shadow: 0 0 5px var(--neon-blue);
        }

        .btn-danger {
            color: var(--neon-red);
            border-color: var(--neon-red);
        }

        .btn-danger:hover {
            background: rgba(255, 51, 102, 0.1);
            box-shadow: inset 0 0 15px var(--neon-red-glow), 0 0 15px var(--neon-red-glow);
            text-shadow: 0 0 5px var(--neon-red);
        }

        input[type="file"] {
            display: none;
        }

        /* Quest Containers */
        .quest-board {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .quest-card {
            background: var(--panel-bg);
            border: 1px solid #2a2a35;
            border-left: 4px solid var(--neon-blue);
            padding: 1.5rem;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: border-color 0.3s;
        }

        .quest-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(45deg, transparent 95%, rgba(0, 210, 255, 0.1) 100%);
            pointer-events: none;
        }

        .quest-card.failed {
            border-left-color: var(--neon-red);
            opacity: 0.7;
        }
        .quest-card.completed {
            border-left-color: #00ff88;
            opacity: 0.7;
        }

        .quest-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            border-bottom: 1px solid #2a2a35;
            padding-bottom: 0.5rem;
        }

        .quest-title {
            font-size: 1.4rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .quest-timer {
            font-family: var(--system-font);
            font-size: 1.2rem;
            color: var(--neon-blue);
            font-weight: bold;
        }
        .quest-card.failed .quest-timer { color: var(--neon-red); }
        .quest-card.completed .quest-timer { color: #00ff88; }

        .smart-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .smart-item {
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .smart-label {
            color: var(--neon-blue);
            font-weight: bold;
            margin-right: 5px;
            font-family: var(--system-font);
        }

        .quest-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 1px solid var(--neon-blue);
            box-shadow: 0 0 30px var(--neon-blue-glow);
            width: 90%;
            max-width: 600px;
            padding: 2rem;
            border-radius: 4px;
            transform: translateY(-20px);
            transition: transform 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-title {
            color: var(--neon-blue);
            font-family: var(--system-font);
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            color: var(--text-muted);
            font-weight: bold;
            font-size: 0.9rem;
        }

        .form-group span {
            color: var(--neon-blue);
            font-family: var(--system-font);
        }

        input[type="text"], input[type="datetime-local"], textarea {
            width: 100%;
            background: #0a0a0d;
            border: 1px solid #2a2a35;
            color: #fff;
            padding: 0.8rem;
            border-radius: 4px;
            font-size: 0.95rem;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .modal-actions button {
            flex: 1;
        }

        /* Scrollbar custom */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 4px; }
    </style>
</head>
<body>

    <header>
        <h1>S I S T E M A</h1>
        <div class="system-alert">Panel de Misiones S.M.A.R.T.</div>
    </header>

    <div class="controls">
        <button onclick="openModal()">[ CREAR NUEVA QUEST ]</button>
        <button onclick="exportJSON()">[ GUARDAR DATOS ]</button>
        <label class="btn-upload">
            <input type="file" id="importFile" accept=".json" onchange="importJSON(event)">
            [ CARGAR DATOS ]
        </label>
    </div>

    <div class="quest-board" id="questBoard">
        <!-- Las misiones se inyectan aquí -->
    </div>

    <!-- Modal Crear Quest -->
    <div class="modal-overlay" id="questModal">
        <div class="modal-content">
            <h2 class="modal-title">¡ALERTA! NUEVA MISIÓN</h2>
            
            <form id="questForm" onsubmit="createQuest(event)">
                <div class="form-group">
                    <label>TÍTULO DE LA MISIÓN</label>
                    <input type="text" id="qTitle" required placeholder="Ej. Derrotar al Rey Demonio (Aprobar Examen)">
                </div>

                <div class="form-group">
                    <label><span>[S]</span>pecific (Específico)</label>
                    <textarea id="qS" required placeholder="¿Qué quieres lograr exactamente?"></textarea>
                </div>

                <div class="form-group">
                    <label><span>[M]</span>easurable (Medible)</label>
                    <textarea id="qM" required placeholder="¿Cómo sabrás que lo has logrado? (Métricas exactas)"></textarea>
                </div>

                <div class="form-group">
                    <label><span>[A]</span>chievable (Alcanzable)</label>
                    <textarea id="qA" required placeholder="¿Cómo lo lograrás? ¿Es realista?"></textarea>
                </div>

                <div class="form-group">
                    <label><span>[R]</span>elevant (Relevante)</label>
                    <textarea id="qR" required placeholder="¿Por qué es importante esta misión para tu nivel?"></textarea>
                </div>

                <div class="form-group">
                    <label><span>[T]</span>ime-bound (Tiempo Límite)</label>
                    <input type="datetime-local" id="qT" required>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-danger" onclick="closeModal()">CANCELAR</button>
                    <button type="submit">ACEPTAR MISIÓN</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Estructura de datos
        let quests = [];

        // DOM Elements
        const questBoard = document.getElementById('questBoard');
        const modal = document.getElementById('questModal');
        const form = document.getElementById('questForm');

        // Inicializar fecha mínima en el input de tiempo
        document.getElementById('qT').min = new Date().toISOString().slice(0, 16);

        // Control del Modal
        function openModal() {
            modal.classList.add('active');
            document.getElementById('qT').min = new Date().toISOString().slice(0, 16);
        }

        function closeModal() {
            modal.classList.remove('active');
            form.reset();
        }

        // Crear Misión
        function createQuest(e) {
            e.preventDefault();
            
            const newQuest = {
                id: Date.now().toString(),
                title: document.getElementById('qTitle').value,
                s: document.getElementById('qS').value,
                m: document.getElementById('qM').value,
                a: document.getElementById('qA').value,
                r: document.getElementById('qR').value,
                deadline: new Date(document.getElementById('qT').value).getTime(),
                status: 'active' // active, completed, failed
            };

            quests.unshift(newQuest);
            closeModal();
            renderQuests();
        }

        // Cambiar Estado
        function completeQuest(id) {
            const quest = quests.find(q => q.id === id);
            if (quest && quest.status === 'active') {
                quest.status = 'completed';
                renderQuests();
            }
        }

        function failQuest(id) {
            const quest = quests.find(q => q.id === id);
            if (quest && quest.status === 'active') {
                quest.status = 'failed';
                renderQuests();
            }
        }

        // Motor de Renderizado
        function renderQuests() {
            questBoard.innerHTML = '';
            
            if (quests.length === 0) {
                questBoard.innerHTML = `<p style="text-align:center; color: var(--text-muted); font-family: var(--system-font);">NO HAY MISIONES ACTIVAS. EL SISTEMA ESTÁ EN ESPERA.</p>`;
                return;
            }

            quests.forEach(quest => {
                const card = document.createElement('div');
                card.className = `quest-card ${quest.status}`;
                card.id = `quest-${quest.id}`;

                let statusText = '';
                let actionButtons = '';

                if (quest.status === 'active') {
                    actionButtons = `
                        <div class="quest-actions">
                            <button class="btn-danger" onclick="failQuest('${quest.id}')">[ RENUNCIAR ]</button>
                            <button onclick="completeQuest('${quest.id}')">[ COMPLETAR ]</button>
                        </div>
                    `;
                } else if (quest.status === 'completed') {
                    statusText = 'MISIÓN COMPLETADA';
                } else {
                    statusText = 'MISIÓN FALLIDA';
                }

                card.innerHTML = `
                    <div class="quest-header">
                        <div class="quest-title">${quest.title}</div>
                        <div class="quest-timer" id="timer-${quest.id}" data-deadline="${quest.deadline}" data-status="${quest.status}">
                            ${statusText}
                        </div>
                    </div>
                    <div class="smart-grid">
                        <div class="smart-item"><span class="smart-label">[S]</span> ${quest.s}</div>
                        <div class="smart-item"><span class="smart-label">[M]</span> ${quest.m}</div>
                        <div class="smart-item"><span class="smart-label">[A]</span> ${quest.a}</div>
                        <div class="smart-item"><span class="smart-label">[R]</span> ${quest.r}</div>
                    </div>
                    ${actionButtons}
                `;
                questBoard.appendChild(card);
            });
            
            updateTimers(); // Actualizar inmediatamente al renderizar
        }

        // Lógica del Temporizador
        function updateTimers() {
            const now = new Date().getTime();
            
            quests.forEach(quest => {
                if (quest.status !== 'active') return;

                const distance = quest.deadline - now;
                const timerElement = document.getElementById(`timer-${quest.id}`);
                
                if (!timerElement) return;

                if (distance < 0) {
                    // El tiempo se acabó, fallar automáticamente
                    quest.status = 'failed';
                    renderQuests();
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                timerElement.innerText = `${days}d ${hours}h ${minutes}m ${seconds}s`;
            });
        }

        // Bucle de actualización cada segundo
        setInterval(updateTimers, 1000);

        // Sistema de Guardado JSON
        function exportJSON() {
            if (quests.length === 0) {
                alert("No hay misiones para guardar.");
                return;
            }
            const dataStr = JSON.stringify(quests, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `Sistema_Quests_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Sistema de Carga JSON
        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (Array.isArray(importedData)) {
                        quests = importedData;
                        renderQuests();
                        // Reset input file para poder subir el mismo archivo si se edita
                        event.target.value = '';
                    } else {
                        alert("El archivo no tiene el formato correcto del Sistema.");
                    }
                } catch (error) {
                    alert("Error al leer el archivo JSON.");
                }
            };
            reader.readAsText(file);
        }

        // Render inicial
        renderQuests();
    </script>
</body>
</html>
