<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kana Database // Cyberpunk</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050510;
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff00ff;
            --neon-yellow: #fcee0a;
            --grid-line: rgba(0, 243, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            /* Efecto de líneas de escaneo CRT */
            background-image: linear-gradient(var(--grid-line) 1px, transparent 1px),
                              linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .glitch-title {
            font-size: 3rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan), 2px 0 0 var(--neon-magenta), -2px 0 0 var(--neon-yellow);
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .cyber-btn {
            background: transparent;
            color: var(--neon-cyan);
            border: 2px solid var(--neon-cyan);
            padding: 10px 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            position: relative;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px inset transparent, 0 0 10px transparent;
        }

        .cyber-btn:hover {
            background: var(--neon-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 15px inset var(--neon-cyan), 0 0 15px var(--neon-cyan);
        }

        .cyber-btn.active {
            background: var(--neon-magenta);
            color: white;
            border-color: var(--neon-magenta);
            box-shadow: 0 0 15px inset var(--neon-magenta), 0 0 15px var(--neon-magenta);
            text-shadow: 0 0 5px white;
        }

        .table-wrapper {
            max-width: 100%;
            overflow-x: auto;
            padding-bottom: 1rem;
        }

        table {
            border-collapse: collapse;
            background: rgba(5, 5, 16, 0.8);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 20px var(--neon-cyan);
            margin: 0 auto;
        }

        th, td {
            width: 70px;
            height: 70px;
            text-align: center;
            vertical-align: middle;
            border: 1px solid var(--grid-line);
        }

        th {
            color: var(--neon-yellow);
            font-size: 1.2rem;
            text-shadow: 0 0 5px var(--neon-yellow);
            background: rgba(252, 238, 10, 0.1);
        }

        td {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: white;
            text-shadow: 0 0 8px var(--neon-cyan);
            transition: all 0.2s;
            cursor: crosshair;
        }

        td:hover {
            background: var(--neon-magenta);
            color: white;
            text-shadow: 0 0 10px white;
            box-shadow: 0 0 15px var(--neon-magenta);
            transform: scale(1.1);
            z-index: 10;
            position: relative;
            border-color: var(--neon-magenta);
        }

        /* Fila separadora para los Dakuten/Handakuten */
        .divider th {
            height: 30px;
            background: rgba(255, 0, 255, 0.1);
            color: var(--neon-magenta);
            text-shadow: 0 0 5px var(--neon-magenta);
            font-size: 0.9rem;
            letter-spacing: 2px;
        }

        td.empty {
            background: repeating-linear-gradient(
                45deg,
                rgba(0, 243, 255, 0.05),
                rgba(0, 243, 255, 0.05) 10px,
                transparent 10px,
                transparent 20px
            );
            cursor: default;
        }

        td.empty:hover {
            transform: none;
            background: repeating-linear-gradient(
                45deg,
                rgba(0, 243, 255, 0.05),
                rgba(0, 243, 255, 0.05) 10px,
                transparent 10px,
                transparent 20px
            );
            box-shadow: none;
            border-color: var(--grid-line);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="glitch-title">SYS.KANA_DB</h1>
        <p>ACCESO A MATRIZ DE CARACTERES: DAKUTEN INTEGRADO</p>
    </div>

    <div class="controls">
        <button id="btn-hiragana" class="cyber-btn active" onclick="loadTable('hiragana')">Hiragana</button>
        <button id="btn-katakana" class="cyber-btn" onclick="loadTable('katakana')">Katakana</button>
    </div>

    <div class="table-wrapper">
        <table id="kana-table">
            <!-- El contenido se inyectará vía JavaScript -->
        </table>
    </div>

    <script>
        const vowels = ['A', 'I', 'U', 'E', 'O'];
        const consonants = [
            '∅', 'K', 'S', 'T', 'N', 'H', 'M', 'Y', 'R', 'W', 'N',
            'G', 'Z', 'D', 'B', 'P'
        ];

        const kanaData = {
            hiragana: [
                ['あ', 'い', 'う', 'え', 'お'],
                ['か', 'き', 'く', 'け', 'こ'],
                ['さ', 'し', 'す', 'せ', 'そ'],
                ['た', 'ち', 'つ', 'て', 'と'],
                ['な', 'に', 'ぬ', 'ね', 'の'],
                ['は', 'ひ', 'ふ', 'へ', 'ほ'],
                ['ま', 'み', 'む', 'め', 'も'],
                ['や', '', 'ゆ', '', 'よ'],
                ['ら', 'り', 'る', 'れ', 'ろ'],
                ['わ', '', '', '', 'を'],
                ['ん', '', '', '', ''],
                // Dakuten (ten-ten)
                ['が', 'ぎ', 'ぐ', 'げ', 'ご'],
                ['ざ', 'じ', 'ず', 'ぜ', 'ぞ'],
                ['だ', 'ぢ', 'づ', 'で', 'ど'],
                ['ば', 'び', 'ぶ', 'べ', 'ぼ'],
                // Handakuten (maru)
                ['ぱ', 'ぴ', 'ぷ', 'ぺ', 'ぽ']
            ],
            katakana: [
                ['ア', 'イ', 'ウ', 'エ', 'オ'],
                ['カ', 'キ', 'ク', 'ケ', 'コ'],
                ['サ', 'シ', 'ス', 'セ', 'ソ'],
                ['タ', 'チ', 'ツ', 'テ', 'ト'],
                ['ナ', 'ニ', 'ヌ', 'ネ', 'ノ'],
                ['ハ', 'ヒ', 'フ', 'ヘ', 'ホ'],
                ['マ', 'ミ', 'ム', 'メ', 'モ'],
                ['ヤ', '', 'ユ', '', 'ヨ'],
                ['ラ', 'リ', 'ル', 'レ', 'ロ'],
                ['ワ', '', '', '', 'ヲ'],
                ['ン', '', '', '', ''],
                // Dakuten (ten-ten)
                ['ガ', 'ギ', 'グ', 'ゲ', 'ゴ'],
                ['ザ', 'ジ', 'ズ', 'ゼ', 'ゾ'],
                ['ダ', 'ヂ', 'ヅ', 'デ', 'ド'],
                ['バ', 'ビ', 'ブ', 'ベ', 'ボ'],
                // Handakuten (maru)
                ['パ', 'ピ', 'プ', 'ペ', 'ポ']
            ]
        };

        function loadTable(type) {
            // Actualizar botones
            document.getElementById('btn-hiragana').classList.toggle('active', type === 'hiragana');
            document.getElementById('btn-katakana').classList.toggle('active', type === 'katakana');

            const table = document.getElementById('kana-table');
            const data = kanaData[type];
            
            let html = '<tr><th>SYS</th>';
            
            // Generar cabeceras de vocales
            vowels.forEach(v => {
                html += `<th>${v}</th>`;
            });
            html += '</tr>';

            // Generar filas
            data.forEach((row, rowIndex) => {
                // Separador visual antes de los Dakuten (fila G)
                if (rowIndex === 11) {
                    html += `<tr class="divider"><th colspan="6">MOD: DAKUTEN ( ゛) / HANDAKUTEN ( ゜)</th></tr>`;
                }

                html += `<tr>`;
                html += `<th>${consonants[rowIndex]}</th>`; // Cabecera de consonante
                
                row.forEach(char => {
                    if (char === '') {
                        html += `<td class="empty"></td>`;
                    } else {
                        html += `<td>${char}</td>`;
                    }
                });
                
                html += `</tr>`;
            });

            table.innerHTML = html;
        }

        // Cargar Hiragana por defecto al iniciar
        window.onload = () => loadTable('hiragana');
    </script>
</body>
</html>
