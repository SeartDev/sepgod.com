<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kana OS // Cyberpunk</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050510;
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff00ff;
            --neon-yellow: #fcee0a;
            --neon-green: #00ff66;
            --neon-red: #ff003c;
            --grid-line: rgba(0, 243, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            background-image: linear-gradient(var(--grid-line) 1px, transparent 1px),
                              linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .glitch-title {
            font-size: 2.5rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan), 2px 0 0 var(--neon-magenta), -2px 0 0 var(--neon-yellow);
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            letter-spacing: 3px;
        }

        .subtitle {
            color: var(--neon-magenta);
            letter-spacing: 2px;
        }

        /* --- BOTONES --- */
        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .cyber-btn {
            background: transparent;
            color: var(--neon-cyan);
            border: 2px solid var(--neon-cyan);
            padding: 10px 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px inset transparent, 0 0 10px transparent;
        }

        .cyber-btn:hover {
            background: var(--neon-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 15px inset var(--neon-cyan), 0 0 15px var(--neon-cyan);
        }

        .cyber-btn.active {
            background: var(--neon-magenta);
            color: white;
            border-color: var(--neon-magenta);
            box-shadow: 0 0 15px inset var(--neon-magenta), 0 0 15px var(--neon-magenta);
            text-shadow: 0 0 5px white;
        }
        
        .btn-quiz {
            border-color: var(--neon-yellow);
            color: var(--neon-yellow);
            margin-bottom: 2rem;
            font-size: 1.3rem;
            padding: 15px 30px;
        }
        .btn-quiz:hover {
            background: var(--neon-yellow);
            color: var(--bg-color);
            box-shadow: 0 0 15px inset var(--neon-yellow), 0 0 15px var(--neon-yellow);
        }

        /* --- VISTAS --- */
        .cyber-view {
            width: 100%;
            max-width: 900px;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }
        .cyber-view.active {
            display: block;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- VISTA: BASE DE DATOS (TABLA) --- */
        .table-wrapper {
            max-width: 100%;
            overflow-x: auto;
            padding-bottom: 1rem;
        }
        table {
            border-collapse: collapse;
            background: rgba(5, 5, 16, 0.8);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 20px var(--neon-cyan);
            margin: 0 auto;
        }
        th, td {
            width: 60px;
            height: 60px;
            text-align: center;
            vertical-align: middle;
            border: 1px solid var(--grid-line);
        }
        th {
            color: var(--neon-yellow);
            font-size: 1rem;
            text-shadow: 0 0 5px var(--neon-yellow);
            background: rgba(252, 238, 10, 0.1);
        }
        td {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            text-shadow: 0 0 8px var(--neon-cyan);
            transition: all 0.2s;
        }
        td:hover:not(.empty) {
            background: var(--neon-magenta);
            color: white;
            text-shadow: 0 0 10px white;
            box-shadow: 0 0 15px var(--neon-magenta);
            transform: scale(1.1);
            z-index: 10;
            position: relative;
            border-color: var(--neon-magenta);
            cursor: crosshair;
        }
        .divider th {
            height: 25px;
            background: rgba(255, 0, 255, 0.1);
            color: var(--neon-magenta);
            font-size: 0.8rem;
            letter-spacing: 2px;
        }
        td.empty {
            background: repeating-linear-gradient(45deg, rgba(0,243,255,0.05), rgba(0,243,255,0.05) 10px, transparent 10px, transparent 20px);
        }

        /* --- VISTA: QUIZ SETUP --- */
        .cyber-panel {
            background: rgba(5, 5, 16, 0.85);
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            padding: 2rem;
        }
        .setup-section { margin-bottom: 1.5rem; }
        .setup-section h3 {
            color: var(--neon-yellow);
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--neon-yellow);
            padding-bottom: 5px;
        }
        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }
        .cyber-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .cyber-label:hover { color: white; text-shadow: 0 0 5px var(--neon-cyan); }
        .cyber-label input { margin-right: 10px; accent-color: var(--neon-magenta); width: 18px; height: 18px; }

        /* --- VISTA: JUEGO QUIZ --- */
        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            margin-bottom: 2rem;
            border: 1px solid var(--neon-cyan);
        }
        .progress-fill {
            height: 100%;
            background: var(--neon-cyan);
            width: 0%;
            transition: width 0.3s;
            box-shadow: 0 0 10px var(--neon-cyan);
        }
        .quiz-container { text-align: center; }
        .kana-display {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 8rem;
            color: white;
            text-shadow: 0 0 20px var(--neon-magenta);
            margin: 2rem 0;
        }
        .terminal-input-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 2rem;
        }
        .terminal-input-group span { color: var(--neon-yellow); }
        .cyber-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            width: 150px;
            text-align: center;
            outline: none;
            text-transform: lowercase;
        }
        .cyber-input:focus {
            border-bottom-color: var(--neon-magenta);
            box-shadow: 0 10px 10px -10px var(--neon-magenta);
        }

        /* --- VISTA: RESULTADOS --- */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 2rem;
        }
        .result-card { border: 1px solid; padding: 1rem; background: rgba(0,0,0,0.5); }
        .card-mastered { border-color: var(--neon-green); box-shadow: 0 0 10px inset rgba(0, 255, 102, 0.2); }
        .card-mastered h3 { color: var(--neon-green); }
        .card-learning { border-color: var(--neon-yellow); box-shadow: 0 0 10px inset rgba(252, 238, 10, 0.2); }
        .card-learning h3 { color: var(--neon-yellow); }
        .card-failing { border-color: var(--neon-red); box-shadow: 0 0 10px inset rgba(255, 0, 60, 0.2); }
        .card-failing h3 { color: var(--neon-red); }
        .kana-list { list-style: none; margin-top: 10px; }
        .kana-list li {
            font-size: 1rem;
            margin-bottom: 5px;
            border-bottom: 1px dashed rgba(255,255,255,0.2);
            padding-bottom: 3px;
        }
        .kana-char {
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: bold;
            font-size: 1.3rem;
            margin-right: 10px;
            color: white;
        }
        .btn-group { display: flex; justify-content: center; gap: 1rem; margin-top: 2rem; }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="glitch-title">SYS.KANA_OS</h1>
        <p class="subtitle" id="main-subtitle">MODO LECTURA: ACTIVO</p>
    </div>

    <div id="quiz-launcher" class="controls">
        <button class="cyber-btn btn-quiz" onclick="switchView('view-setup')">INICIAR MÓDULO QUIZ</button>
    </div>

    <div id="view-database" class="cyber-view active">
        <div class="controls">
            <button id="btn-hiragana" class="cyber-btn active" onclick="loadTable('hiragana')">Hiragana</button>
            <button id="btn-katakana" class="cyber-btn" onclick="loadTable('katakana')">Katakana</button>
        </div>
        <div class="table-wrapper">
            <table id="kana-table"></table>
        </div>
    </div>

    <div id="view-setup" class="cyber-view cyber-panel">
        <div class="setup-section">
            <h3>1. SELECCIONA ALFABETO</h3>
            <div class="checkbox-grid">
                <label class="cyber-label"><input type="checkbox" id="chk-hiragana" checked> Hiragana</label>
                <label class="cyber-label"><input type="checkbox" id="chk-katakana"> Katakana</label>
            </div>
        </div>
        <div class="setup-section">
            <h3>2. SELECCIONA FAMILIAS (FILAS)</h3>
            <div class="checkbox-grid" id="families-container">
                </div>
        </div>
        <div class="btn-group">
            <button class="cyber-btn" style="border-color: gray; color: gray;" onclick="switchView('view-database')">VOLVER A DB</button>
            <button class="cyber-btn btn-quiz" style="margin:0;" onclick="startQuiz()">COMENZAR PRUEBA</button>
        </div>
    </div>

    <div id="view-quiz" class="cyber-view cyber-panel">
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        <div class="quiz-container">
            <p style="color:var(--neon-yellow);">INGRESA EL ROMAJI Y PRESIONA ENTER</p>
            <div id="kana-display" class="kana-display">あ</div>
            <div class="terminal-input-group">
                <span>></span>
                <input type="text" id="romaji-input" class="cyber-input" autocomplete="off">
            </div>
        </div>
    </div>

    <div id="view-results" class="cyber-view cyber-panel">
        <h2 style="text-align:center; color: white;">DIAGNÓSTICO COMPLETADO</h2>
        <p style="text-align:center; margin-top: 10px;">Análisis de 3 iteraciones por Kana.</p>
        
        <div class="results-grid">
            <div class="result-card card-mastered">
                <h3>DOMINADO</h3>
                <p>3/3 aciertos.</p>
                <ul id="list-mastered" class="kana-list"></ul>
            </div>
            <div class="result-card card-learning">
                <h3>INTERMEDIO</h3>
                <p>1 o 2 aciertos.</p>
                <ul id="list-learning" class="kana-list"></ul>
            </div>
            <div class="result-card card-failing">
                <h3>FALLO CRÍTICO</h3>
                <p>0 aciertos.</p>
                <ul id="list-failing" class="kana-list"></ul>
            </div>
        </div>
        <div class="btn-group">
            <button class="cyber-btn" onclick="switchView('view-setup')">NUEVA PRUEBA</button>
            <button class="cyber-btn" onclick="switchView('view-database')">SALIR A DB</button>
        </div>
    </div>

    <script>
        /* =========================================================
           LÓGICA DE LA TABLA (BASE DE DATOS)
           ========================================================= */
        const vowels = ['A', 'I', 'U', 'E', 'O'];
        const consonants = ['∅','K','S','T','N','H','M','Y','R','W','N','G','Z','D','B','P'];

        const tableData = {
            hiragana: [
                ['あ','い','う','え','お'],['か','き','く','け','こ'],['さ','し','す','せ','そ'],['た','ち','つ','て','と'],
                ['な','に','ぬ','ね','の'],['は','ひ','ふ','へ','ほ'],['ま','み','む','め','も'],['や','','ゆ','','よ'],
                ['ら','り','る','れ','ろ'],['わ','','','','を'],['ん','','','',''],
                ['が','ぎ','ぐ','げ','ご'],['ざ','じ','ず','ぜ','ぞ'],['だ','ぢ','づ','で','ど'],['ば','び','ぶ','べ','ぼ'],['ぱ','ぴ','ぷ','ぺ','ぽ']
            ],
            katakana: [
                ['ア','イ','ウ','エ','オ'],['カ','キ','ク','ケ','コ'],['サ','シ','ス','セ','ソ'],['タ','チ','ツ','テ','ト'],
                ['ナ','ニ','ヌ','ネ','ノ'],['ハ','ヒ','フ','ヘ','ホ'],['マ','ミ','ム','メ','モ'],['ヤ','','ユ','','ヨ'],
                ['ラ','リ','ル','レ','ロ'],['ワ','','','','ヲ'],['ン','','','',''],
                ['ガ','ギ','グ','ゲ','ゴ'],['ザ','ジ','ズ','ゼ','ゾ'],['ダ','ヂ','ヅ','デ','ド'],['バ','ビ','ブ','ベ','ボ'],['パ','ピ','プ','ペ','ポ']
            ]
        };

        function loadTable(type) {
            document.getElementById('btn-hiragana').classList.toggle('active', type === 'hiragana');
            document.getElementById('btn-katakana').classList.toggle('active', type === 'katakana');

            const table = document.getElementById('kana-table');
            const data = tableData[type];
            let html = '<tr><th>SYS</th>' + vowels.map(v => `<th>${v}</th>`).join('') + '</tr>';

            data.forEach((row, rowIndex) => {
                if (rowIndex === 11) html += `<tr class="divider"><th colspan="6">MOD: DAKUTEN ( ゛) / HANDAKUTEN ( ゜)</th></tr>`;
                html += `<tr><th>${consonants[rowIndex]}</th>`;
                row.forEach(char => {
                    html += char === '' ? `<td class="empty"></td>` : `<td>${char}</td>`;
                });
                html += `</tr>`;
            });
            table.innerHTML = html;
        }

        /* =========================================================
           LÓGICA DEL SISTEMA DE VISTAS (SPA)
           ========================================================= */
        function switchView(viewId) {
            // Ocultar todas las vistas
            document.querySelectorAll('.cyber-view').forEach(view => view.classList.remove('active'));
            
            // Mostrar la seleccionada
            document.getElementById(viewId).classList.add('active');

            // Manejar la visibilidad del botón de lanzar Quiz y el subtítulo
            const launcher = document.getElementById('quiz-launcher');
            const subtitle = document.getElementById('main-subtitle');
            
            if (viewId === 'view-database') {
                launcher.style.display = 'flex';
                subtitle.innerText = "MODO LECTURA: ACTIVO";
            } else {
                launcher.style.display = 'none';
                subtitle.innerText = "MODO SIMULADOR: ACTIVO";
            }
        }

        /* =========================================================
           LÓGICA DEL QUIZ
           ========================================================= */
        const quizConfig = [
            { id: 'vowels', label: 'Vocales (A,I,U,E,O)', r: [['a'], ['i'], ['u'], ['e'], ['o']], h: ['あ','い','う','え','お'], k: ['ア','イ','ウ','エ','オ'] },
            { id: 'k', label: 'Fila K', r: [['ka'], ['ki'], ['ku'], ['ke'], ['ko']], h: ['か','き','く','け','こ'], k: ['カ','キ','ク','ケ','コ'] },
            { id: 's', label: 'Fila S', r: [['sa'], ['shi','si'], ['su'], ['se'], ['so']], h: ['さ','し','す','せ','そ'], k: ['サ','シ','ス','セ','ソ'] },
            { id: 't', label: 'Fila T', r: [['ta'], ['chi','ti'], ['tsu','tu'], ['te'], ['to']], h: ['た','ち','つ','て','と'], k: ['タ','チ','ツ','テ','ト'] },
            { id: 'n', label: 'Fila N', r: [['na'], ['ni'], ['nu'], ['ne'], ['no']], h: ['な','に','ぬ','ね','の'], k: ['ナ','ニ','ヌ','ネ','ノ'] },
            { id: 'h', label: 'Fila H', r: [['ha'], ['hi'], ['fu','hu'], ['he'], ['ho']], h: ['は','ひ','ふ','へ','ほ'], k: ['ハ','ヒ','フ','ヘ','ホ'] },
            { id: 'm', label: 'Fila M', r: [['ma'], ['mi'], ['mu'], ['me'], ['mo']], h: ['ま','み','む','め','も'], k: ['マ','ミ','ム','メ','モ'] },
            { id: 'y', label: 'Fila Y', r: [['ya'], null, ['yu'], null, ['yo']], h: ['や','','ゆ','','よ'], k: ['ヤ','','ユ','','ヨ'] },
            { id: 'r', label: 'Fila R', r: [['ra'], ['ri'], ['ru'], ['re'], ['ro']], h: ['ら','り','る','れ','ろ'], k: ['ラ','リ','ル','レ','ロ'] },
            { id: 'w', label: 'Fila W / N', r: [['wa'], null, null, null, ['wo','o'], ['n']], h: ['わ','','','','を','ん'], k: ['ワ','','','','ヲ','ン'] },
            { id: 'g', label: 'Fila G (Dakuten)', r: [['ga'], ['gi'], ['gu'], ['ge'], ['go']], h: ['が','ぎ','ぐ','げ','ご'], k: ['ガ','ギ','グ','ゲ','ゴ'] },
            { id: 'z', label: 'Fila Z (Dakuten)', r: [['za'], ['ji','zi'], ['zu'], ['ze'], ['zo']], h: ['ざ','じ','ず','ぜ','ぞ'], k: ['ザ','ジ','ズ','ゼ','ゾ'] },
            { id: 'd', label: 'Fila D (Dakuten)', r: [['da'], ['ji','di'], ['zu','du'], ['de'], ['do']], h: ['だ','ぢ','づ','で','ど'], k: ['ダ','ヂ','ヅ','デ','ド'] },
            { id: 'b', label: 'Fila B (Dakuten)', r: [['ba'], ['bi'], ['bu'], ['be'], ['bo']], h: ['ば','び','ぶ','べ','ぼ'], k: ['バ','ビ','ブ','ベ','ボ'] },
            { id: 'p', label: 'Fila P (Handakuten)', r: [['pa'], ['pi'], ['pu'], ['pe'], ['po']], h: ['ぱ','ぴ','ぷ','ぺ','ぽ'], k: ['パ','ピ','プ','ペ','ポ'] }
        ];

        let quizPool = [], currentIdx = 0, userStats = {};
        const REPETITIONS = 3;

        // Inyectar checkboxes
        const container = document.getElementById('families-container');
        quizConfig.forEach(family => {
            const label = document.createElement('label');
            label.className = 'cyber-label';
            label.innerHTML = `<input type="checkbox" class="chk-family" value="${family.id}"> ${family.label}`;
            container.appendChild(label);
        });

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = array[j], array[i];
            }
        }

        function startQuiz() {
            const useHiragana = document.getElementById('chk-hiragana').checked;
            const useKatakana = document.getElementById('chk-katakana').checked;
            const selectedFamilies = Array.from(document.querySelectorAll('.chk-family:checked')).map(chk => chk.value);

            if (!useHiragana && !useKatakana) return alert('Selecciona al menos un alfabeto.');
            if (selectedFamilies.length === 0) return alert('Selecciona al menos una familia.');

            quizPool = []; userStats = {};

            selectedFamilies.forEach(famId => {
                const family = quizConfig.find(f => f.id === famId);
                for (let i = 0; i < family.r.length; i++) {
                    if (family.r[i] === null) continue;
                    const validRomajis = family.r[i];
                    if (useHiragana && family.h[i]) addKanaToPool(family.h[i], validRomajis);
                    if (useKatakana && family.k[i]) addKanaToPool(family.k[i], validRomajis);
                }
            });

            shuffleArray(quizPool);
            currentIdx = 0;
            switchView('view-quiz');
            loadNextQuestion();
        }

        function addKanaToPool(character, romajiArray) {
            userStats[character] = { romaji: romajiArray[0], correct: 0, mistakes: [] };
            for (let i = 0; i < REPETITIONS; i++) quizPool.push({ char: character, validAnswers: romajiArray });
        }

        function loadNextQuestion() {
            if (currentIdx >= quizPool.length) return showResults();
            document.getElementById('kana-display').innerText = quizPool[currentIdx].char;
            document.getElementById('romaji-input').value = '';
            document.getElementById('romaji-input').focus();
            document.getElementById('progress-fill').style.width = `${(currentIdx / quizPool.length) * 100}%`;
        }

        document.getElementById('romaji-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const userAnswer = this.value.trim().toLowerCase();
                if (userAnswer === '') return;
                
                const currentQuestion = quizPool[currentIdx];
                if (currentQuestion.validAnswers.includes(userAnswer)) {
                    userStats[currentQuestion.char].correct++;
                } else {
                    userStats[currentQuestion.char].mistakes.push(userAnswer);
                }
                currentIdx++;
                loadNextQuestion();
            }
        });

        function showResults() {
            switchView('view-results');
            document.getElementById('progress-fill').style.width = '100%';
            
            const [listM, listL, listF] = [document.getElementById('list-mastered'), document.getElementById('list-learning'), document.getElementById('list-failing')];
            listM.innerHTML = ''; listL.innerHTML = ''; listF.innerHTML = '';

            for (const [char, data] of Object.entries(userStats)) {
                const li = document.createElement('li');
                if (data.correct === 3) {
                    li.innerHTML = `<span class="kana-char">${char}</span> [${data.romaji}]`;
                    listM.appendChild(li);
                } else if (data.correct > 0) {
                    const mistakes = [...new Set(data.mistakes)].join(', ');
                    li.innerHTML = `<span class="kana-char">${char}</span> [${data.romaji}] <br><small style="color:#aaa;">Pusiste: ${mistakes}</small>`;
                    listL.appendChild(li);
                } else {
                    const mistakes = [...new Set(data.mistakes)].join(', ');
                    li.innerHTML = `<span class="kana-char">${char}</span> [${data.romaji}] <br><small style="color:#aaa;">Pusiste: ${mistakes}</small>`;
                    listF.appendChild(li);
                }
            }

            if(listM.children.length === 0) listM.innerHTML = "<li>Ninguno.</li>";
            if(listL.children.length === 0) listL.innerHTML = "<li>Ninguno.</li>";
            if(listF.children.length === 0) listF.innerHTML = "<li>Sin fallos críticos.</li>";
        }

        // Inicializar
        window.onload = () => loadTable('hiragana');
    </script>
</body>
</html>
