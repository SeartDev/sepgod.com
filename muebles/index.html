<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Planogramas - Buscador API</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --success-color: #27ae60;
            --warning-color: #f39c12;
            --highlight-color: #e74c3c;
            --api-color: #8e44ad;
            --bg-color: #ecf0f1;
            --shelf-color: #7f8c8d;
            --slot-color: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-color);
        }

        h1 { color: var(--primary-color); margin-bottom: 10px; text-align: center; }

        /* Contenedores de vistas */
        .view {
            display: none;
            width: 100%;
            max-width: 900px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            box-sizing: border-box;
        }

        .view.active { display: block; }

        /* Botones */
        .btn-group { display: flex; gap: 15px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        button {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        button:hover { background-color: #2980b9; }
        button:active { transform: scale(0.97); }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; transform: none; }
        
        button.btn-outline { background-color: transparent; color: var(--primary-color); border: 2px solid var(--primary-color); }
        button.btn-outline:hover { background-color: var(--primary-color); color: white; }
        
        button.btn-success { background-color: var(--success-color); }
        button.btn-success:hover { background-color: #219150; }
        
        button.btn-warning { background-color: var(--warning-color); color: white; }
        button.btn-warning:hover { background-color: #d68910; }

        button.btn-api { background-color: var(--api-color); padding: 12px 15px;}
        button.btn-api:hover { background-color: #732d91; }

        /* Formulario y Buscador */
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--primary-color); }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #bdc3c7;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .input-con-boton {
            display: flex;
            gap: 10px;
        }

        .search-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #e0e0e0;
        }
        
        .search-container input { margin-bottom: 0; max-width: 400px; }
        #resultadoBusqueda { font-size: 15px; margin-bottom: 20px; min-height: 24px; }

        /* Diseño visual del Mueble */
        .mueble-container {
            margin-top: 10px;
            background-color: #34495e;
            padding: 25px;
            border-radius: 8px;
            border: 10px solid #2c3e50;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.7);
            overflow-x: auto; 
        }
        .mueble-titulo { color: white; margin-top: 0; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 2px; }
        
        .charola {
            display: flex;
            justify-content: flex-start; 
            align-items: flex-end;
            background-color: transparent;
            border-bottom: 15px solid var(--shelf-color);
            min-height: 150px; 
            margin-bottom: 25px;
            padding-bottom: 8px;
            box-shadow: 0 5px 3px -2px rgba(0,0,0,0.5);
            gap: 15px; 
            padding-left: 15px;
            padding-right: 15px;
        }
        .charola:last-child { margin-bottom: 0; }

        /* Espacio del Producto (Slot) */
        .producto-slot {
            width: 80px;
            height: 110px;
            background-color: var(--slot-color);
            border: 2px dashed #bdc3c7;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #95a5a6;
            font-size: 11px;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            overflow: hidden;
            position: relative;
            box-sizing: border-box;
            padding: 5px;
        }
        .producto-slot:hover {
            transform: translateY(-5px) scale(1.03);
            background-color: #f1c40f;
            border-color: #f39c12;
            color: #333;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
            z-index: 5;
        }

        .producto-slot.tiene-producto {
            border: 1px solid #ddd;
            background-color: white;
            justify-content: space-between;
        }
        .producto-slot.tiene-producto .slot-vacio-text { display: none; }
        
        .producto-slot.resaltado {
            border: 4px solid var(--highlight-color) !important;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.9) !important;
            transform: scale(1.1) translateY(-5px);
            z-index: 10;
        }
        
        .slot-imagen {
            width: 100%;
            height: 70%;
            object-fit: contain; 
            margin-bottom: 5px;
        }
        .slot-nombre {
            width: 100%;
            font-size: 10px;
            color: #333;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis; 
        }

        /* VENTANA MODAL (EDITOR) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none; 
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-overlay.active { display: flex; }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 100%;
            max-width: 500px;
            position: relative;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        .modal-close {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: #95a5a6;
        }
        .modal-close:hover { color: #e74c3c; }

        .preview-container {
            width: 100%;
            height: 150px;
            border: 2px dashed #bdc3c7;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
            color: #95a5a6;
            overflow: hidden;
        }
        #imagenPreviewImg {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none; 
        }

    </style>
</head>
<body>

    <h1>Gestor de Planogramas</h1>

    <!-- VISTA 1: MENÚ PRINCIPAL -->
    <div id="vista-menu" class="view active">
        <h2>¿Qué deseas hacer?</h2>
        <p>Crea la estructura de tu mueble, carga el último guardado o importa un archivo.</p>
        <div class="btn-group">
            <button onclick="mostrarVista('vista-crear')">➕ Crear Mueble Nuevo</button>
            <button onclick="cargarMueble()" class="btn-outline">🔄 Cargar Último Mueble</button>
            
            <button onclick="document.getElementById('inputImportar').click()" class="btn-warning">📂 Importar Archivo .json</button>
            <input type="file" id="inputImportar" accept=".json" style="display: none;" onchange="importarDesdeArchivo(event)">
        </div>
    </div>

    <!-- VISTA 2: FORMULARIO CREAR MUEBLE -->
    <div id="vista-crear" class="view">
        <h2>Configuración de la Estructura</h2>
        
        <div class="form-group">
            <label for="nombreMueble">Nombre del Mueble:</label>
            <input type="text" id="nombreMueble" placeholder="Ej. Pasillo 3 - Bebidas" required>
        </div>
        
        <div class="form-group">
            <label for="numCharolas">Cantidad de Charolas (Niveles vertical):</label>
            <input type="number" id="numCharolas" min="1" max="10" placeholder="Ej. 4" required>
        </div>
        
        <div class="form-group">
            <label for="numProductos">Cantidad de espacios por charola (Horizontal):</label>
            <input type="number" id="numProductos" min="1" max="20" placeholder="Ej. 6" required>
        </div>

        <div class="btn-group">
            <button onclick="mostrarVista('vista-menu')" class="btn-outline">Cancelar</button>
            <button onclick="crearEstructuraMueble()" class="btn-success">✅ Generar Mueble Vacío</button>
        </div>
    </div>

    <!-- VISTA 3: PLANOGRAMA VISUAL -->
    <div id="vista-planograma" class="view">
        <h2 id="titulo-visual">Planograma Interactivo</h2>
        
        <div class="btn-group" style="margin-bottom: 20px;">
            <button onclick="mostrarVista('vista-menu')" class="btn-outline">⬅️ Volver al Menú</button>
            <button onclick="mostrarVista('vista-crear')">➕ Crear Nuevo</button>
            <button onclick="exportarAArchivo()" class="btn-warning">💾 Guardar en Archivo</button>
        </div>

        <!-- ZONA DE BUSCADOR -->
        <div class="search-container">
            <input type="text" id="inputBuscar" placeholder="🔍 Buscar por nombre o código..." onkeyup="if(event.key === 'Enter') buscarProducto()">
            <button onclick="buscarProducto()" class="btn-success">Buscar</button>
            <button onclick="limpiarBusqueda(true)" class="btn-outline">Limpiar</button>
        </div>
        <div id="resultadoBusqueda"></div>

        <p style="font-size: 14px; margin-bottom:10px;">Haz clic en cualquier espacio vacío para editar el producto.</p>

        <!-- MUEBLE GENERADO -->
        <div id="contenedor-mueble" class="mueble-container">
            <!-- Las charolas y productos se generarán aquí -->
        </div>
    </div>

    <!-- MODAL: EDITOR DE PRODUCTO -->
    <div id="modal-editor" class="modal-overlay">
        <div class="modal-content">
            <span class="modal-close" onclick="cerrarModal()">&times;</span>
            <h3 id="modal-titulo">Editar Espacio</h3>
            
            <div class="form-group">
                <label for="prodCodigo">Código de Barras (Opcional):</label>
                <div class="input-con-boton">
                    <input type="text" id="prodCodigo" placeholder="Ej. 7501055365470">
                    <!-- NUEVO BOTÓN: TEST CÓDIGOS -->
                    <button type="button" id="btnTestApi" onclick="testCodigoAPI()" class="btn-api" title="Buscar información en base de datos abierta">⚡ Test códigos</button>
                </div>
            </div>

            <div class="form-group">
                <label for="prodNombre">Nombre del Producto:</label>
                <input type="text" id="prodNombre" placeholder="Ej. Coca-Cola 600ml">
            </div>

            <div class="form-group">
                <label>Imagen del Producto (Manual):</label>
                <input type="file" id="inputImagen" accept="image/*" onchange="previsualizarImagen(this)">
                <div class="preview-container">
                    <span id="previewText">Vista previa</span>
                    <img id="imagenPreviewImg" src="" alt="Previsualización">
                </div>
            </div>

            <div class="btn-group" style="margin-top: 30px;">
                <button onclick="cerrarModal()" class="btn-outline">Cancelar</button>
                <button onclick="guardarProducto()" class="btn-success">Guardar Producto</button>
            </div>
        </div>
    </div>

    <script>
        let planogramaData = null;
        let slotActual = null; 
        let imagenBase64Actual = null; // Guardará Base64 local o la URL externa de la API

        // --- GESTIÓN DE VISTAS ---
        function mostrarVista(idVista) {
            document.querySelectorAll('.view').forEach(vista => vista.classList.remove('active'));
            document.getElementById(idVista).classList.add('active');
            
            if(idVista === 'vista-crear') {
                document.getElementById('nombreMueble').value = '';
                document.getElementById('numCharolas').value = '';
                document.getElementById('numProductos').value = '';
            }
        }

        // --- CARGAR/GUARDAR EN LOCAL STORAGE ---
        function cargarMueble() {
            const datosGuardados = localStorage.getItem('planogramaInteractivo');
            if (datosGuardados) {
                planogramaData = JSON.parse(datosGuardados);
                dibujarMuebleCompleto();
            } else {
                alert("No hay ningún planograma guardado temporalmente. Crea uno nuevo o importa un archivo.");
            }
        }

        function guardarEnLocalStorage() {
            if (planogramaData) {
                localStorage.setItem('planogramaInteractivo', JSON.stringify(planogramaData));
            }
        }

        // --- EXPORTAR E IMPORTAR ---
        function exportarAArchivo() {
            if (!planogramaData) {
                alert("No hay datos para exportar.");
                return;
            }
            const datosTexto = JSON.stringify(planogramaData, null, 2);
            const archivoBlob = new Blob([datosTexto], { type: 'application/json' });
            const urlArchivo = URL.createObjectURL(archivoBlob);
            
            const enlaceDescarga = document.createElement('a');
            enlaceDescarga.href = urlArchivo;
            
            const nombreSeguro = planogramaData.nombre.replace(/[^a-z0-9]/gi, '_').toLowerCase();
            enlaceDescarga.download = `planograma_${nombreSeguro}.json`;
            
            document.body.appendChild(enlaceDescarga);
            enlaceDescarga.click();
            
            document.body.removeChild(enlaceDescarga);
            URL.revokeObjectURL(urlArchivo);
        }

        function importarDesdeArchivo(event) {
            const archivo = event.target.files[0];
            if (!archivo) return;
            const lector = new FileReader();
            
            lector.onload = function(e) {
                try {
                    const contenido = e.target.result;
                    const datosNuevos = JSON.parse(contenido);
                    
                    if (datosNuevos && datosNuevos.nombre && datosNuevos.estructura) {
                        planogramaData = datosNuevos;
                        guardarEnLocalStorage(); 
                        dibujarMuebleCompleto();
                        event.target.value = '';
                    } else {
                        alert("El archivo no parece ser un planograma válido.");
                    }
                } catch (error) {
                    alert("Error al leer el archivo. Asegúrate de que sea un archivo JSON válido.");
                }
            };
            lector.readAsText(archivo);
        }

        // --- CREACIÓN Y RENDERIZADO VISUAL ---
        function crearEstructuraMueble() {
            const nombre = document.getElementById('nombreMueble').value;
            const numCharolas = parseInt(document.getElementById('numCharolas').value);
            const numProductos = parseInt(document.getElementById('numProductos').value);

            if (!nombre || isNaN(numCharolas) || isNaN(numProductos) || numCharolas <= 0 || numProductos <= 0) {
                alert("Por favor, completa todos los campos con valores válidos.");
                return;
            }

            planogramaData = {
                nombre: nombre,
                estructura: [] 
            };

            for (let i = 0; i < numCharolas; i++) {
                let charola = [];
                for (let j = 0; j < numProductos; j++) {
                    charola.push(null); 
                }
                planogramaData.estructura.push(charola);
            }

            guardarEnLocalStorage();
            dibujarMuebleCompleto();
        }

        function dibujarMuebleCompleto() {
            if(!planogramaData) return;

            limpiarBusqueda(true); 

            document.getElementById('titulo-visual').textContent = `Mueble: ${planogramaData.nombre}`;
            const contenedor = document.getElementById('contenedor-mueble');
            contenedor.innerHTML = ''; 
            
            const tituloInterno = document.createElement('h3');
            tituloInterno.className = 'mueble-titulo';
            tituloInterno.textContent = planogramaData.nombre;
            contenedor.appendChild(tituloInterno);

            planogramaData.estructura.forEach((charolaData, indexFila) => {
                const charolaEl = document.createElement('div');
                charolaEl.className = 'charola';

                charolaData.forEach((producto, indexColumna) => {
                    const slotEl = document.createElement('div');
                    slotEl.className = 'producto-slot';
                    slotEl.id = `slot-${indexFila}-${indexColumna}`;
                    
                    slotEl.onclick = () => abrirEditorProducto(indexFila, indexColumna);

                    if (producto) {
                        slotEl.classList.add('tiene-producto');
                        
                        const imgEl = document.createElement('img');
                        imgEl.className = 'slot-imagen';
                        imgEl.src = producto.imagen;
                        imgEl.alt = producto.nombre;

                        const nombreEl = document.createElement('div');
                        nombreEl.className = 'slot-nombre';
                        nombreEl.textContent = producto.nombre;
                        nombreEl.title = producto.nombre; 

                        slotEl.appendChild(imgEl);
                        slotEl.appendChild(nombreEl);

                        if(producto.codigo) {
                             slotEl.title = `${producto.nombre} - CB: ${producto.codigo}`;
                        }

                    } else {
                        const textoVacio = document.createElement('span');
                        textoVacio.className = 'slot-vacio-text';
                        textoVacio.innerHTML = `[ ${indexFila + 1}.${indexColumna + 1} ]<br>Vacío`;
                        slotEl.appendChild(textoVacio);
                    }
                    charolaEl.appendChild(slotEl);
                });
                contenedor.appendChild(charolaEl);
            });
            mostrarVista('vista-planograma');
        }

        // --- FUNCIONES DEL BUSCADOR EN MUEBLE ---
        function buscarProducto() {
            const query = document.getElementById('inputBuscar').value.trim().toLowerCase();
            const divResultado = document.getElementById('resultadoBusqueda');
            
            limpiarBusqueda(false); 

            if (!query) {
                divResultado.innerHTML = `<span style="color: var(--primary-color);">Escribe un nombre o código para buscar.</span>`;
                return;
            }

            let encontrados = [];

            planogramaData.estructura.forEach((charolaData, indexFila) => {
                charolaData.forEach((producto, indexColumna) => {
                    if (producto) {
                        const nombreMatch = producto.nombre.toLowerCase().includes(query);
                        const codigoMatch = producto.codigo && producto.codigo.toLowerCase().includes(query);

                        if (nombreMatch || codigoMatch) {
                            encontrados.push(`<strong>Charola ${indexFila + 1}</strong>, Posición <strong>${indexColumna + 1}</strong>`);
                            const slotDOM = document.getElementById(`slot-${indexFila}-${indexColumna}`);
                            if(slotDOM) slotDOM.classList.add('resaltado');
                        }
                    }
                });
            });

            if (encontrados.length > 0) {
                divResultado.innerHTML = `<span style="color: green;">✅ <strong>¡Encontrado!</strong> Se ubicó en:</span><br>${encontrados.join('<br>')}`;
            } else {
                divResultado.innerHTML = `<span style="color: red;">❌ Producto no encontrado.</span>`;
            }
        }

        function limpiarBusqueda(borrarTexto = true) {
            if (borrarTexto) {
                document.getElementById('inputBuscar').value = '';
            }
            document.getElementById('resultadoBusqueda').innerHTML = '';
            const todosResaltados = document.querySelectorAll('.producto-slot.resaltado');
            todosResaltados.forEach(el => el.classList.remove('resaltado'));
        }

        // --- GESTIÓN DEL MODAL / EDITOR ---
        function abrirEditorProducto(fila, columna) {
            slotActual = { fila, columna };
            const productoActual = planogramaData.estructura[fila][columna];
            
            document.getElementById('modal-titulo').textContent = `Editar Espacio [Charola ${fila + 1}, Posición ${columna + 1}]`;
            
            document.getElementById('inputImagen').value = '';
            document.getElementById('prodNombre').value = '';
            document.getElementById('prodCodigo').value = '';
            const previewImg = document.getElementById('imagenPreviewImg');
            const previewText = document.getElementById('previewText');
            
            previewImg.src = '';
            previewImg.style.display = 'none';
            previewText.style.display = 'block';
            imagenBase64Actual = null; // Reiniciar estado temporal de imagen

            if (productoActual) {
                document.getElementById('prodNombre').value = productoActual.nombre;
                document.getElementById('prodCodigo').value = productoActual.codigo || '';
                if(productoActual.imagen) {
                    previewImg.src = productoActual.imagen;
                    previewImg.style.display = 'block';
                    previewText.style.display = 'none';
                }
            }
            document.getElementById('modal-editor').classList.add('active');
        }

        function cerrarModal() {
            document.getElementById('modal-editor').classList.remove('active');
            slotActual = null;
        }

        function previsualizarImagen(input) {
            const previewImg = document.getElementById('imagenPreviewImg');
            const previewText = document.getElementById('previewText');
            imagenBase64Actual = null;

            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImg.src = e.target.result;
                    previewImg.style.display = 'block';
                    previewText.style.display = 'none';
                    imagenBase64Actual = e.target.result; 
                }
                reader.readAsDataURL(input.files[0]); 
            } else {
                const productoActual = planogramaData.estructura[slotActual.fila][slotActual.columna];
                if(!productoActual || !productoActual.imagen) {
                    previewImg.src = '';
                    previewImg.style.display = 'none';
                    previewText.style.display = 'block';
                }
            }
        }

        // --- NUEVO: FUNCIÓN PARA CONECTAR A LA API OPEN FOOD FACTS ---
        async function testCodigoAPI() {
            const codigo = document.getElementById('prodCodigo').value.trim();
            if (!codigo) {
                alert("Primero escribe un código de barras para buscar.");
                return;
            }

            const btnApi = document.getElementById('btnTestApi');
            const textoOriginal = btnApi.innerHTML;
            btnApi.innerHTML = "⏳ Buscando...";
            btnApi.disabled = true;

            try {
                // Hacemos la consulta a la base de datos pública Open Food Facts
                const url = `https://world.openfoodfacts.org/api/v0/product/${codigo}.json`;
                const respuesta = await fetch(url);
                const datos = await respuesta.json();

                if (datos.status === 1 && datos.product) {
                    const producto = datos.product;
                    
                    // Asignar el nombre si lo encuentra
                    if (producto.product_name) {
                        // Si trae marca, la unimos al nombre para que sea más claro
                        let nombreFinal = producto.product_name;
                        if(producto.brands) {
                            nombreFinal = producto.brands + ' - ' + nombreFinal;
                        }
                        document.getElementById('prodNombre').value = nombreFinal;
                    }

                    // Asignar la imagen si la encuentra
                    const urlImagen = producto.image_front_url || producto.image_url;
                    if (urlImagen) {
                        const previewImg = document.getElementById('imagenPreviewImg');
                        const previewText = document.getElementById('previewText');
                        
                        previewImg.src = urlImagen;
                        previewImg.style.display = 'block';
                        previewText.style.display = 'none';
                        
                        // Guardamos la URL de la imagen en vez de la subida por el usuario
                        imagenBase64Actual = urlImagen;
                    }
                } else {
                    alert("No se encontró el producto en la base de datos pública. Tendrás que llenarlo manualmente.");
                }
            } catch (error) {
                console.error("Error al buscar en API:", error);
                alert("Ocurrió un error al intentar conectar con la base de datos de productos.");
            } finally {
                // Restauramos el botón
                btnApi.innerHTML = textoOriginal;
                btnApi.disabled = false;
            }
        }

        // --- GUARDAR PRODUCTO EN EL SLOT ---
        function guardarProducto() {
            if (!slotActual) return;

            const nombre = document.getElementById('prodNombre').value;
            const codigo = document.getElementById('prodCodigo').value;
            
            if (!nombre) {
                alert("Por favor, ponle un nombre al producto.");
                return;
            }

            const productoExistente = planogramaData.estructura[slotActual.fila][slotActual.columna];
            let imagenFinal = imagenBase64Actual;

            // Si no subió ni trajo imagen nueva, usar la que ya tenía (si existía)
            if (!imagenFinal && productoExistente) {
                imagenFinal = productoExistente.imagen; 
            }

            if (!imagenFinal) {
                alert("Por favor, selecciona una imagen o búscalo con el código.");
                return;
            }

            const nuevoProducto = {
                nombre: nombre,
                codigo: codigo,
                imagen: imagenFinal 
            };

            planogramaData.estructura[slotActual.fila][slotActual.columna] = nuevoProducto;

            guardarEnLocalStorage();
            dibujarMuebleCompleto();
            cerrarModal();
        }

    </script>
</body>
